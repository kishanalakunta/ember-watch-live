name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install --require-hashes --no-deps -r requirements/dev.txt
      - name: Lint (incl. bandit security rules)
        run: ruff check .
      - name: Tests (FWI reference values, fusion, API auth/RBAC/integrity)
        run: |
          set +e
          pytest -q -rfE 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          [ "$code" -ne 0 ] && python scripts/annotate.py pytest.log "pytest failed"
          exit $code
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements/api.txt --require-hashes --strict
      - name: Offline end-to-end smoke run
        run: python -m wildfire.pipeline --all --fixtures --out /tmp/site/data
      - name: Secret scan of tracked files
        run: |
          if git grep -nE '(MAP_KEY|API_KEY|SECRET)[^A-Za-z_]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{24,}' -- ':!*.md' ':!.github/*' ; then
            echo "::error::Possible hard-coded secret"; exit 1; fi
