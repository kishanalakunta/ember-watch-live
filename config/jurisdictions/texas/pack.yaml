# Jurisdiction Configuration Pack — Texas reference deployment (PRD §9.3)
# Everything Texas-specific lives here. The core engine reads this file and
# contains no Texas, US, NOAA or FAA logic of its own (FR-CORE-1, FR-2).
id: texas
name: Texas, United States
country: US
region: TX
timezone: America/Chicago
units: imperial            # imperial | metric  (FR-31)
languages: [en]
terminology:
  fire: wildfire
  incident: incident

roles:                      # [TO VALIDATE with agencies] — PRD assumption A2
  wildfire_lead: Texas A&M Forest Service (TAMFS)
  emergency_management: Texas Division of Emergency Management (TDEM)

ecosystems: [grassland, shrubland, pine_forest]

geography:
  boundary: boundary.geojson   # Natural Earth, simplified
  places: places.geojson       # Natural Earth populated places (coarse global baseline)
  grid_spacing_deg: 0.5        # weather/risk grid; native resolution is shown in the UI

providers:
  active_fire:
    - id: nasa_firms
      sources: [VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT, VIIRS_SNPP_NRT, MODIS_NRT]
      day_range: 3
  weather:
    - id: open_meteo
      model: gfs_hrrr          # NOAA HRRR (3 km, hourly) served by Open-Meteo
      fallback_model: best_match
      past_days: 60            # spin-up for the Canadian FWI moisture codes
      forecast_days: 3
  incidents:
    - id: nifc_wfigs           # NIFC WFIGS current incident locations + perimeters

detection:
  cluster_radius_km: 2.0       # observations closer than this join one cluster (FR-11)
  cluster_window_hours: 36
  max_spread_kmh: 3.0            # head-fire spread allowance between passes
  incident_match_km: 5.0       # cross-reference radius to known incidents (FR-12)
  exposure_radius_km: 40.0
  static_source:               # Permian Basin gas flares produce persistent VIIRS hits
    min_distinct_days: 2       # tuned on live runs (Oct 2026): flares were reaching priority review
    max_extent_km: 0.8
  routing:                     # decision support only — a human makes every call (PRD A5)
    priority_review: 0.85
    verify: 0.50
    min_passes_for_priority: 2 # needs 2 separate overpass windows (or one unmistakable look)
    window_gap_hours: 3        # NOAA-20/21 and S-NPP pass ~50 min apart: count as one window
    stale_after_hours: 14      # missed by the latest pass -> weak signal

risk:
  model_id: fwi-system-v1
  primary_index: fwi
  # EFFIS FWI danger classes, used as a starting point. [TO CALIBRATE for Texas grasslands]
  classes:
    - {name: Low,       min: 0}
    - {name: Moderate,  min: 5.2}
    - {name: High,      min: 11.2}
    - {name: Very high, min: 21.3}
    - {name: Extreme,   min: 38.0}
  validation:
    status: not_validated      # FR-39 / FR-40
    note: >-
      Fire Weather Index system computed from HRRR weather. Thresholds are EFFIS
      defaults and have not been calibrated against Texas fire occurrence. Validate
      against TAMFS fire history before operational use.

compliance: [TEXAS_TAC_202, TX_RAMP]   # labels shown in the UI; controls live in SECURITY.md
aviation:
  regulation_profile: FAA_US           # Part 107 / BVLOS / TFR rules apply to UAS verification
